[project]
name = "anti-tech-debt-app"
version = "0.1.0"
description = "Local-first queue-driven TUI scaffold for anti-tech-debt workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "prompt-toolkit>=3.0.47,<4",
  "rich>=13.7.1,<14",
  "ruff>=0.16.5",
]

[project.scripts]
anti-tech-debt-app = "anti_tech_debt_app.app:main"

[dependency-groups]
dev = [
  "pytest>=8.2.0,<9",
  "pytest-asyncio>=0.23.7,<1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anti_tech_debt_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.workspace]
members = ["src/anti_tech_debt_app"]
